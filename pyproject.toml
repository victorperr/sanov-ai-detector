[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-sanov"
version = "0.1.0"
description = "Statistical AI-text detection with types, Sanov's theorem, and watermark analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18", "scikit-learn>=1.4"]
app = ["streamlit>=1.32", "pandas>=2.0", "plotly>=5.20"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
all = ["ai-text-sanov[ml,app,dev]"]

[project.scripts]
ai-detector = "ai_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
